<div class="row">
    <div class="col">
        <h2>Account Settings</h2>
    </div>
</div>
<div class="row">
    <div class="col-lg-8">
        <h4 class="mt-3">Email Address</h4>
        <p>
            Your account email is <strong data-bind="text: user() && user().email"></strong>.
            You use it to sign in, and it's where we send messages, donation receipts and notices.
        </p>
        <form data-bind="submit: requestEmailChange">
            <div class="form-group">
                <label for="account-new-email">New email address</label>
                <input type="email" id="account-new-email" class="form-control" autocomplete="email" required
                       data-bind="textInput: newEmail, disable: sending"/>
            </div>
            <button type="submit" class="btn btn-ergatas-primary"
                    data-bind="disable: sending() || newEmail().trim() === ''">
                <i class="fas fa-envelope"></i> Change Email
            </button>
        </form>
        <div class="alert alert-success mt-3" role="status" style="display:none" data-bind="visible: sentTo">
            We sent a confirmation link to <strong data-bind="text: sentTo"></strong>.
            Open it within 24 hours to finish the change. Until then, your account keeps your current email address.
        </div>
        <div class="alert alert-danger mt-3" role="alert" style="display:none" data-bind="visible: error, text: error"></div>
    </div>
</div>
